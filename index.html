<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cabine de Fotos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
 
  <style>
    /* Estilos mínimos para garantir visualização */
    body { margin: 0; background: #111; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #video, #canvas { max-width: 100vw; max-height: 100vh; display: none; margin: 0 auto; }
    #guideline { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border: 3px dashed rgba(255,255,255,0.6); display: none; }
    #countdown { position: fixed; top: 20px; right: 20px; font-size: 64px; display: none; }
    #message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 8px; display: none; }
    #controls { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; }
    #controls button { font-size: 20px; padding: 12px 14px; border-radius: 10px; border: 0; cursor: pointer; }
    #controls button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- Linha guia para proporção 4:5 -->
  <div id="guideline"></div>

  <!-- Timer -->
  <div id="countdown"></div>

  <div id="message">Erro ao acessar a câmera. Verifique as configurações.</div>

  <div id="controls">
  <button id="startCamera" title="Iniciar câmera"><i class="fas fa-camera"></i></button>
  <button id="takePortraitPhoto" title="Tirar foto 4:5" disabled><i class="fas fa-camera-retro"></i></button>

  <!-- novo: escolher pasta destino -->
  <button id="chooseFolder" title="Escolher pasta de destino"><i class="fas fa-folder-open"></i></button>

  <!-- salvar direto na pasta local -->
  <button id="uploadPhoto" title="Salvar na pasta" disabled><i class="fas fa-folder"></i></button>

  <!-- opcional: manter download se quiser -->
  <button id="downloadPhoto" title="Baixar" disabled><i class="fas fa-download"></i></button>

  <button id="returnToCamera" title="Voltar" style="display:none;"><i class="fas fa-arrow-left"></i></button>
</div>

<script>
  // ========= DOM refs =========
  const startCameraButton = document.getElementById('startCamera');
  const takePortraitPhotoButton = document.getElementById('takePortraitPhoto');
  const downloadPhotoButton = document.getElementById('downloadPhoto');
  const uploadPhotoButton = document.getElementById('uploadPhoto'); // agora "Salvar na pasta"
  const chooseFolderButton = document.getElementById('chooseFolder');
  const returnToCameraButton = document.getElementById('returnToCamera');

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const guideline = document.getElementById('guideline');
  const countdown = document.getElementById('countdown');
  const message = document.getElementById('message');
  const ctx = canvas.getContext('2d');
  const aspectRatio = 4 / 5;

  // Logos
  const topLogoImage = new Image();
  const bottomLogoImage = new Image();
  topLogoImage.src = 'top-logo.png';
  bottomLogoImage.src = 'bottom-logo.png';

  let stream = null;

  // File System Access API
  let dirHandle = null;

  function showMessage(msg, duration = 3000) {
    message.textContent = msg;
    message.style.display = 'block';
    setTimeout(() => { message.style.display = 'none'; }, duration);
  }

  function updateGuideline(ar) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    let w, h;
    if (vw / vh > ar) { h = vh; w = h * ar; } else { w = vw; h = w / ar; }
    guideline.style.width = w + 'px';
    guideline.style.height = h + 'px';
    guideline.style.display = 'block';
  }

  updateGuideline(aspectRatio);
  window.addEventListener('resize', () => updateGuideline(aspectRatio));

  // ========= Camera =========
  startCameraButton.addEventListener('click', async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      video.style.display = 'block';
      takePortraitPhotoButton.disabled = false;
      startCameraButton.disabled = true;
      updateGuideline(aspectRatio);
    } catch (err) {
      console.error(err);
      showMessage('Erro ao acessar a câmera. Verifique permissões do navegador.');
    }
  });

  function startCountdown(seconds, onFinish) {
    let t = seconds;
    countdown.style.display = 'block';
    countdown.textContent = t;
    const id = setInterval(() => {
      t -= 1;
      countdown.textContent = t;
      if (t <= 0) {
        clearInterval(id);
        countdown.style.display = 'none';
        onFinish();
      }
    }, 1000);
  }

  takePortraitPhotoButton.addEventListener('click', () => {
    startCountdown(3, () => cropPhoto(aspectRatio));
  });

  function drawLogos() {
    const topLogoWidth = canvas.width * 0.2;
    const topLogoHeight = topLogoWidth * (topLogoImage.height / topLogoImage.width || 1);
    if (topLogoImage.complete && topLogoImage.naturalWidth > 0) {
      ctx.drawImage(topLogoImage, (canvas.width - topLogoWidth) / 2, 10, topLogoWidth, topLogoHeight);
    }
    const bottomLogoWidth = canvas.width * 0.4;
    const bottomLogoHeight = bottomLogoWidth * (bottomLogoImage.height / bottomLogoImage.width || 1);
    if (bottomLogoImage.complete && bottomLogoImage.naturalWidth > 0) {
      ctx.drawImage(bottomLogoImage, (canvas.width - bottomLogoWidth) / 2, canvas.height - bottomLogoHeight - 10, bottomLogoWidth, bottomLogoHeight);
    }
  }

  function cropPhoto(ar) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) {
      showMessage('Erro ao tirar a foto. Tente novamente.');
      return;
    }

    const guideW = guideline.offsetWidth;
    const guideH = guideline.offsetHeight;

    let cw, ch;
    if (vw / vh > ar) { ch = vh; cw = ch * ar; } else { cw = vw; ch = cw / ar; }

    const x = (vw - cw) / 2;
    const y = (vh - ch) / 2;

    canvas.width = guideW;
    canvas.height = guideH;

    ctx.drawImage(video, x, y, cw, ch, 0, 0, guideW, guideH);
    drawLogos();

    canvas.style.display = 'block';
    video.style.display = 'none';
    downloadPhotoButton.disabled = false;

    // só habilita salvar se a pasta já foi escolhida
    uploadPhotoButton.disabled = !dirHandle;

    takePortraitPhotoButton.disabled = true;
    returnToCameraButton.style.display = 'inline';
  }

  downloadPhotoButton.addEventListener('click', () => {
    const dataURL = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.href = dataURL;
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    link.download = `foto_${ts}.png`;
    link.click();
  });

  returnToCameraButton.addEventListener('click', () => {
    canvas.style.display = 'none';
    video.style.display = 'block';
    guideline.style.display = 'block';
    downloadPhotoButton.disabled = true;
    uploadPhotoButton.disabled = !dirHandle;
    takePortraitPhotoButton.disabled = false;
    returnToCameraButton.style.display = 'none';
  });

  // ========= Pasta local =========
  function fsSupported() {
    return typeof window.showDirectoryPicker === 'function';
  }

  async function verifyPermission(handle, mode = 'readwrite') {
    const q = await handle.queryPermission({ mode });
    if (q === 'granted') return true;
    const r = await handle.requestPermission({ mode });
    return r === 'granted';
  }

  chooseFolderButton.addEventListener('click', async () => {
    try {
      if (!fsSupported()) {
        showMessage('Seu navegador não suporta salvar direto na pasta. Use Chrome ou Edge atual em https ou localhost.');
        return;
      }
      // em alguns navegadores, startIn pode ser ignorado
      dirHandle = await window.showDirectoryPicker({ id: 'CabineDeFotos', mode: 'readwrite', startIn: 'pictures' });
      const ok = await verifyPermission(dirHandle, 'readwrite');
      if (!ok) {
        showMessage('Permissão negada para gravar na pasta.');
        dirHandle = null;
        uploadPhotoButton.disabled = true;
        return;
      }
      showMessage('Pasta selecionada com sucesso.', 2000);
      // se já existe uma foto na tela, permite salvar
      if (canvas.style.display === 'block') uploadPhotoButton.disabled = false;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // usuário cancelou
      console.error(err);
      showMessage('Erro ao selecionar a pasta.');
    }
  });

  async function canvasToBlob(type = 'image/png', quality) {
    return new Promise(resolve => {
      canvas.toBlob(blob => resolve(blob), type, quality);
    });
  }

  async function saveCanvasToFolder() {
    try {
      if (!dirHandle) {
        showMessage('Escolha uma pasta antes de salvar.');
        return;
      }
      const ok = await verifyPermission(dirHandle, 'readwrite');
      if (!ok) {
        showMessage('Permissão negada para gravar na pasta.');
        return;
      }

      uploadPhotoButton.disabled = true;

      const blob = await canvasToBlob('image/png');
      if (!blob) {
        showMessage('Falha ao gerar a imagem.');
        uploadPhotoButton.disabled = false;
        return;
      }

      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      const fileName = `cabine_foto_${ts}.png`;

      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();

      showMessage(`Foto salva como ${fileName}`, 4000);
    } catch (err) {
      console.error(err);
      showMessage('Erro ao salvar na pasta. Veja o console para detalhes.');
    } finally {
      uploadPhotoButton.disabled = false;
    }
  }

  // reaproveita o botão de upload como "Salvar na pasta"
  uploadPhotoButton.addEventListener('click', saveCanvasToFolder);
</script>

</body>
</html>
